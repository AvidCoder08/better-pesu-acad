# Streamlit Secrets Configuration Template
# Copy this file to .streamlit/secrets.toml and fill in your actual values
# DO NOT commit secrets.toml to version control!

# Firebase/Firestore Configuration
# Path to your Firebase service account JSON file (recommended approach)
firebase_service_account = "firebase-credentials.json"

# Google Drive Configuration (optional - only if using Google Drive storage)
# You can use either a file path or inline JSON string
# google_drive_service_account = "path/to/google-drive-service-account.json"
google_drive_service_account_json = """{"type":"service_account","project_id":"...","private_key_id":"...","private_key":"-----BEGIN PRIVATE KEY-----\n...\n-----END PRIVATE KEY-----\n","client_email":"...","client_id":"...","auth_uri":"https://accounts.google.com/o/oauth2/auth","token_uri":"https://oauth2.googleapis.com/token","auth_provider_x509_cert_url":"https://www.googleapis.com/oauth2/v1/certs","client_x509_cert_url":"..."}"""
google_drive_shared_drive_id = "your-shared-drive-id"

# GitHub Configuration (required for file storage)
github_token = "github_pat_..."
github_repo = "username/repository-name"
github_branch = "main"
